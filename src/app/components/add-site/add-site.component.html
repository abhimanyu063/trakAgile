<form [formGroup]="siteForm" (ngSubmit)="onSiteAdd()">
  <div class="content">
    <div class="input-container c1">
      <ion-select label="Trip Type" label-placement="floating" fill="outline" formControlName="tripTypeId">
        <ion-select-option value="1">Local</ion-select-option>
        <ion-select-option value="2">Non Local</ion-select-option>
      </ion-select>
    </div>
    <div class="input-container c1">
      <ion-select label="District" label-placement="floating" fill="outline" formControlName="districtId">
        <ion-select-option *ngFor="let district of districts"
          [value]="district.districtId">{{district.districtName}}</ion-select-option>
      </ion-select>
    </div>
    <div class="input-container c1">
      <ion-input label="Site Name" label-placement="floating" fill="outline" placeholder="Site Name"
        formControlName="siteName" maxlength="100"></ion-input>
    </div>
    <div class="input-container c1">
      <ion-select label="Site Type" label-placement="floating" fill="outline" formControlName="siteTypeId">
        <ion-select-option *ngFor="let siteType of siteTypes"
          [value]="siteType.siteTypeId">{{siteType.siteTypeDescription}}</ion-select-option>
      </ion-select>
    </div>
    <div class="input-container c1">
      <ion-input label="Village" label-placement="floating" fill="outline" placeholder="Village"
        formControlName="siteVillageName" maxlength="100"></ion-input>
    </div>
  </div>
  <div class="footer">
    <ion-button type="submit" class="footer-btn" color="primary" size="large" expand="block">Add Site</ion-button>
  </div>
</form>
