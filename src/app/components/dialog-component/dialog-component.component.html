<ion-modal #confirmModal style="color:#00FFFFFF">
  <ng-template>
    <ion-card>
      <ion-card-header color="primary" style="padding:0px">
        <h4 style="margin-left:30px">Invalid Credentials</h4>
      </ion-card-header>
      <ion-card-content style="text-align:center;">
        <div>
          <ion-icon name="key-outline" color="primary"
            style="height:100px; width:150px; margin-left:auto; margin-right: auto;"></ion-icon>
          <p style="color:#FF7F50; font-size:14px">Invalid User Name or Password</p>
        </div>
      </ion-card-content>
    </ion-card>
  </ng-template>
</ion-modal>
