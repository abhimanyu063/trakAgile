<ion-card>
  <ion-card-header style="margin:0px; padding:0px;">
    <ion-row>
      <ion-col col-lg-9>
        <p style="margin-left:10px">Site : <span>{{siteModel.siteName}} </span> </p>
      </ion-col>
      <ion-col col-lg-3>
        <p style="margin-left:10px">Date : <span>{{siteModel.createdOn | date: 'dd-MM-yyyy'}} </span> </p>
      </ion-col>
    </ion-row>
  </ion-card-header>
  <ion-card-content>
    <ion-label>
      <ion-row>
        <ion-col col-lg-12>
          <h3>Location : {{siteModel.siteVillageName}}, {{siteModel.districtName}} </h3>
        </ion-col>
      </ion-row>
      <ion-row>
        <ion-col col-lg-12>
          <h3>Site Type : {{siteModel.siteTypeDescription}} </h3>
        </ion-col>
      </ion-row>
    </ion-label>
  </ion-card-content>
  <ion-row style="margin-left:0px; padding:0px">
    <h3 style="font-size:14px; margin-left:10px">Status : {{siteModel.isWorkCompleted?
      'Completed':siteModel.isTripEnded ? 'Ended': 'Started'}} </h3>
  </ion-row>
</ion-card>
