<form [formGroup]="formWorkflow" (ngSubmit)="onSaveWorkflow()">
  <div class="content">
    <div class="input-container c1" *ngIf="!isReportSite">
      <ion-select label="Work Type" label-placement="floating" fill="outline" formControlName="workTypeId">
        <ion-select-option *ngFor="let workType of workTypes"
          [value]="workType.workTypeId">{{workType.workTypeName}}</ion-select-option>
      </ion-select>
    </div>
    <div class="input-container c1" *ngIf="!isReportSite">
      <ion-input label="Upload Document" type="file" label-placement="floating" fill="outline" placeholder="Upload"
        formControlName="uploadDocument" (change)="onFileChange($event)"></ion-input>
    </div>
    <div class="textarea-container c1" *ngIf="!isReportSite">
      <ion-textarea label="Document Description" labelPlacement="floating" fill="outline"
        formControlName="documentDescription" placeholder="Document Description" maxlength="500"
        [counter]="true"></ion-textarea>
    </div>
    <div class="textarea-container c1" *ngIf="isReportSite">
      <ion-textarea label="Report Comment" labelPlacement="floating" fill="outline" formControlName="comment"
        placeholder="Report Comment" maxlength="500" [counter]="true"></ion-textarea>
    </div>
  </div>
  <div class="btn-group footer" *ngIf="isReportSite">
    <ion-button color="primary" class="footer-btn" size="large" expand="block" (click)="onReportSite()"
      type="button">Submit
    </ion-button>
    <ion-button color="primary" class="footer-btn" size="large" expand="block"
      (click)="closeReportSiteDiv()" type="button">
      Cancel</ion-button>
  </div>
  <div class="btn-group footer" *ngIf="!isSubmitted">
    <ion-button color="primary" class="footer-btn" size="large" expand="block" type="submit">Submit</ion-button>
    <ion-button color="danger" class="footer-btn" size="large" expand="block"
      (click)="openReportSiteDiv()" type="button">Report
    </ion-button>
  </div>
</form>
