<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-menu-button defaultHref=""></ion-menu-button>
    </ion-buttons>
    <ion-title>Welcome, {{userName}}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">

  <ion-button color="primary" shape="round"  size="large" expand="block" (click)="onTripStarted()" *ngIf="!isTripStarted">
    Start Trip
  </ion-button>
  <div *ngIf="isTripStarted">
    <app-add-site (onSiteAdded)="onSiteAdded($event)" 
    *ngIf="!isSiteAdded" [tripId]="tripId"></app-add-site>
    <div *ngIf="isSiteAdded">
      <app-workflow (onWorkCompleted)="onWorkCompleted($event)" ></app-workflow>
    </div>
    <ion-button color="primary" shape="round"  size="large" expand="block" (click)="onTripEnded()" *ngIf="isWorkCompleted">
      End Trip
    </ion-button>
  </div>
  <ion-alert
  [isOpen]="isTripStarted"
  header="Alert"
  subHeader="Important message"
  message={{message}}
  [buttons]="alertButtons"
></ion-alert>
</ion-content>
