<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-menu-button defaultHref=""></ion-menu-button>
    </ion-buttons>
    <ion-title>Welcome, {{userName}}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-button color="primary" shape="round" size="large" expand="block" (click)="onTripStarted()"
    *ngIf="isShowTripStartBtn">
    Start Trip
  </ion-button>
  <div *ngIf="isTripStarted">
    <app-add-site (onSiteAdded)="onSiteAdded($event)" (onSiteId)="onSiteId($event)" *ngIf="!isSiteAdded" [tripId]="tripId"></app-add-site>
    <div *ngIf="isSiteAdded">
      <app-workflow (onWorkCompleted)="onWorkCompleted($event)" [siteId]="siteId"></app-workflow>
    </div>
    <ion-button color="primary" shape="round" size="large" expand="block" (click)="onTripEnded()"
      *ngIf="isWorkCompleted">
      End Trip
    </ion-button>
  </div>
  <!-- <ion-toast [is-open]="isTripStarted" message={{message}} class="custom-toast" [buttons]="toastButtons"></ion-toast> -->
</ion-content>
