<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button defaultHref=""></ion-menu-button>
    </ion-buttons>
    <ion-title>Welcome, {{userName}}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">

  <ion-button expand="block" (click)="onTripStarted()" *ngIf="!isTripStarted">
    Start Trip
  </ion-button>
  <div *ngIf="isTripStarted">
    <app-add-site></app-add-site>
    <div *ngIf="isSiteAdded">
      <app-workflow></app-workflow>
    </div>
  </div>
  <ion-alert
  [isOpen]="isTripStarted"
  header="Alert"
  subHeader="Important message"
  message="Trip Started Successfully"
  [buttons]="alertButtons"
></ion-alert>
</ion-content>
