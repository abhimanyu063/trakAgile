<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-menu-button defaultHref=""></ion-menu-button>
    </ion-buttons>
    <ion-title>Welcome, {{userName}}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="wrapper">
    <div class="footer">
      <ion-button color="primary" class="footer-btn" size="large" expand="block" (click)="onTripStarted()" *ngIf="isShowTripStartBtn">
        Start Trip
      </ion-button>
    </div>
    <div *ngIf="isTripStarted">
      <app-add-site (onSiteAdded)="onSiteAdded($event)" (onSiteId)="onSiteId($event)" *ngIf="!isSiteAdded"
        [tripId]="tripId"></app-add-site>
      <div *ngIf="isSiteAdded">
        <app-workflow (onWorkCompleted)="onWorkCompleted($event)" [siteId]="siteId"></app-workflow>
      </div>
      <div class="footer" *ngIf="isWorkCompleted">
        <ion-button color="primary" class="footer-btn" size="large" expand="block" (click)="onTripEnded()">
          End Trip
        </ion-button>
      </div>
    </div>
  </div>
</ion-content>
