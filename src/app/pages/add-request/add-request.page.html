<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref=""></ion-back-button>
    </ion-buttons>
      <ion-title>Add Request</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div>
    <form [formGroup]="requestForm" (ngSubmit)="onRequestAdd()">
      <div class="input-container c1">
        <ion-select label="Request Type" label-placement="floating" fill="outline" 
        formControlName="requestTypeId">
        <ion-select-option *ngFor="let requestType of requestTypes" [value]="requestType.requestTypeId">{{requestType.requestTypeDescription}}</ion-select-option>
        </ion-select>
      </div>
      <div class="input-container c1">
        <ion-input label="Request Date" label-placement="floating" fill="outline" placeholder="Request Date" 
        formControlName="requestComment" id="open-modal"></ion-input>
      </div>
      <div class="input-container c1">
        <ion-input label="Comment" label-placement="floating" fill="outline" placeholder="Comment" 
        formControlName="requestComment"></ion-input>
      </div>
      <div>
        <ion-button type="submit">Submit Request</ion-button>
      </div>
    </form>
  </div>
  <ion-modal trigger="open-modal" [initialBreakpoint]="1" [breakpoints]="[0, 1]">
    <ng-template>
      <div class="block">
        <ion-datetime #datetime [(ngModel)]="dateValue"
        (ionFocus)="dateTimeUpdated()">
          <ion-buttons slot="buttons">
            <ion-button color="primary">Cancel</ion-button>
            <ion-button color="primary" (click)="onDateSelect($event)">Done</ion-button>
          </ion-buttons>
        </ion-datetime>
      </div>
    </ng-template>
  </ion-modal>
</ion-content>
