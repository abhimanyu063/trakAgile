<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="home"></ion-back-button>
    </ion-buttons>
    <ion-title>Change Password</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="wrapper">
    <form [formGroup]="changePasswordForm" (ngSubmit)="onChangePassword()">
      <div class="content">
        <div class="input-container c1">
          <ion-input label="Old Password" label-placement="floating" fill="outline" placeholder="Old Password"
            formControlName="oldPassword" maxlength="50"></ion-input>
        </div>
        <div class="input-container c1">
          <ion-input label="New Password" label-placement="floating" fill="outline" placeholder="New Password"
            formControlName="newPassword" maxlength="50"></ion-input>
        </div>
        <div class="input-container c1">
          <ion-input label="Confirm Password" label-placement="floating" fill="outline" placeholder="Confirm Password"
            formControlName="confirmPassword" maxlength="50"></ion-input>
        </div>
      </div>
      <div class="footer">
        <ion-button type="submit" class="footer-btn" color="primary" size="large"
          expand="block">Submit</ion-button>
      </div>
    </form>
  </div>
</ion-content>
