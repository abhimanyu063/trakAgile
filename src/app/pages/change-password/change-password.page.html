<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="home"></ion-back-button>
    </ion-buttons>
    <ion-title>Change Password</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div>
    <form [formGroup]="changePasswordForm" (ngSubmit)="onChangePassword()">
      <div class="input-container c1">
        <ion-input label="Old Password" label-placement="floating" fill="outline" placeholder="Old Password"
          formControlName="oldPassword"></ion-input>
      </div>
      <div class="input-container c1">
        <ion-input label="New Password" label-placement="floating" fill="outline" placeholder="New Password"
          formControlName="newPassword"></ion-input>
      </div>
      <div class="input-container c1">
        <ion-input label="Confirm Password" label-placement="floating" fill="outline" placeholder="Confirm Password"
          formControlName="confirmPassword"></ion-input>
      </div>
      <div>
        <ion-button type="submit" color="primary" shape="round" size="large" expand="block">Save</ion-button>
      </div>
    </form>
  </div>
  <ion-toast [is-open]="isAlertOpen" message={{message}} class="custom-toast" [buttons]="toastButtons"></ion-toast>
</ion-content>
